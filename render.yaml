# Render 蓝图（Blueprint）：在 Render 新建 Blueprints 仓库时自动读取
services:
  - type: web
    name: badminton-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/badminton.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: JWT_SECRET
        generateValue: true   # 部署时自动生成随机密钥
      # 微信登录凭据：用蓝图重建时取消注释并填值（不要把这个文件里的 secret 提交进公开仓库）
      # 当前线上服务已通过 Dashboard/API 配好这两个变量，无需重建
      # - key: WECHAT_APPID
      #   value: wx????????????????
      # - key: WECHAT_SECRET
      #   value: ????????????????????????????????
      # 正式号还需把 request/uploadFile 合法域名设为 https://badminton-api-5k6c.onrender.com（测试号免配）
    disk:
      name: badminton-data
      mountPath: /data
      sizeGB: 1   # 注意：Render 磁盘为付费项（约 $1/月）；纯免费请删掉本段并接受重启清库
