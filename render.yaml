# Render 蓝图（Blueprint）：在 Render 新建 Blueprints 仓库时自动读取
services:
  - type: web
    name: badminton-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/badminton.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: JWT_SECRET
        generateValue: true   # 部署时自动生成随机密钥
      # 微信登录凭据：必须是「小程序」账号的 AppID/AppSecret（公众号测试号换不出小程序 code）
      # 用蓝图重建时取消注释并填值（不要把真实 secret 提交进仓库）
      # - key: WECHAT_APPID
      #   value: wx????????????????
      # - key: WECHAT_SECRET
      #   value: ????????????????????????????????
      # 另需在小程序后台「开发设置 → 服务器域名」把 request / uploadFile 域名设为 https://badminton-api-5k6c.onrender.com
    disk:
      name: badminton-data
      mountPath: /data
      sizeGB: 1   # 注意：Render 磁盘为付费项（约 $1/月）；纯免费请删掉本段并接受重启清库
