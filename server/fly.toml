# fly.toml — fly.io 免费部署（1GB 持久卷挂 /data，空闲自动停机零费用）
app = "badminton-api"
primary_region = "nrt" # 东京，国内访问相对快

[build]

[mounts]
  source = "badminton_data"
  destination = "/data"

[env]
  DATABASE_URL = "sqlite:////data/badminton.db"
  UPLOAD_DIR = "/data/uploads"

[[services]]
  internal_port = 8000
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  [[services.ports]]
    port = 80
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 25
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    path = "/api/health"
